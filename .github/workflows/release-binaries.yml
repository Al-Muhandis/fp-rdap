name: Release binaries

# Builds the rdapcli console utility and attaches the binaries to the GitHub
# release on version tags: a Windows exe (x64) and a Linux ELF (x86_64,
# glibc). On workflow_dispatch the job only builds and uploads workflow
# artifacts, so the pipeline can be validated without touching a release.
#
# Plain FPC build (no Lazarus IDE in CI): the project tree compiles with unit
# paths only - src/rdapclient, the sibling fp-idn repository (punycode for
# IDNA) and the Synapse repository (SOCKS5 proxy transport), mirroring the
# local build recipe. HTTPS at runtime needs OpenSSL libraries in PATH (the
# same requirement as the library; the DLLs/so are not bundled here).
#
# The release itself (manifest commit, release notes) is created by
# opm-update.yml on the same tag push; the attach step below is idempotent
# (create-if-missing) so the two workflows can race safely.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdapcli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: rdapcli-linux-x86_64
          - os: windows-latest
            asset: rdapcli-windows-x64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Clone fp-idn and Synapse
        run: |
          git clone --depth 1 https://github.com/Al-Muhandis/fp-idn.git ../fp-idn
          git clone --depth 1 https://github.com/geby/synapse.git ../synapse

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fpc

      - name: Install FPC 3.2.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # SourceForge is unusable from CI: datacenter IPs get an HTML
          # interstitial instead of the file from every mirror, the dedicated
          # win64 installer was renamed away, and the silent win32+cross
          # installer pair from downloads.freepascal.org installs nothing in
          # VERYSILENT mode. The official portable tree of the 3.2.2 release
          # (no installer involved) works instead: it ships ppcx64.exe, its
          # own binutils and the precompiled win64 units.
          New-Item -ItemType Directory -Force fpc322 | Out-Null
          Set-Location fpc322
          Invoke-WebRequest -Uri 'https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-win64/fpc-3.2.2.x86_64-win64.tar' -OutFile fpc.tar -TimeoutSec 900
          tar -xf fpc.tar
          tar -xf fpc-3.2.2.x86_64-win64/binary.x86_64-win64.tar
          tar -xzf x86_64-win64-base.x86_64-linux.tar.gz
          foreach ($pkg in 'rtl-console','rtl-extra','rtl-generics','rtl-objpas','rtl-unicode','fcl-base','fcl-json','fcl-net','fcl-web','openssl','hash','paszlib','regexpr','zlib') {
            tar -xzf "units-$pkg.x86_64-win64.tar.gz"
          }
          # The core RTL lands in units\x86_64-win64 while the package units
          # go to lib\fpc\3.2.2\units\x86_64-win64 - merge for a single -Fu root.
          Move-Item units\x86_64-win64\rtl lib\fpc\3.2.2\units\x86_64-win64\rtl
          Remove-Item units -Recurse -Force
          $fpcExe = "$PWD\bin\x86_64-win64\ppcx64.exe"
          if (-not (Test-Path $fpcExe)) { Get-ChildItem -Recurse -Depth 2 | Select-Object -ExpandProperty FullName; exit 1 }
          $ver = (& $fpcExe -iV | Out-String).Trim()
          "FPC version: $ver"
          if ($ver -ne '3.2.2') { exit 1 }
          "FPC_EXE=$fpcExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FPC_UNITROOT=$PWD\lib\fpc\3.2.2\units\x86_64-win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build rdapcli (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p units
          fpc -Sc -O3 -Xs -o"$GITHUB_WORKSPACE/${{ matrix.asset }}" -Fusrc -Fu../fp-idn -Fu../synapse -FUunits cli/rdapcli.lpr

      - name: Build rdapcli (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # -Sc enables the C-style compound operators (+= etc.) used by
          # fp-idn: the 3.2.2 release compiler does not turn them on in
          # objfpc mode by default (the Debian/apt build the Linux job uses
          # is a later fixes snapshot and accepts them as-is).
          New-Item -ItemType Directory -Force units | Out-Null
          $pkgs = 'rtl','rtl-console','rtl-extra','rtl-generics','rtl-objpas','rtl-unicode','fcl-base','fcl-json','fcl-net','fcl-web','openssl','hash','paszlib','regexpr','zlib'
          $argList = @('-Sc','-O3','-Xs',"-o$($env:GITHUB_WORKSPACE)\${{ matrix.asset }}")
          foreach ($pkg in $pkgs) { $argList += "-Fu$($env:FPC_UNITROOT)\$pkg" }
          $argList += @('-Fusrc','-Fu..\fp-idn','-Fu..\synapse','-FUunits','cli\rdapcli.lpr')
          & $env:FPC_EXE @argList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach to the GitHub release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "fp-rdap ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber

      - name: Upload as a workflow artifact (validation runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

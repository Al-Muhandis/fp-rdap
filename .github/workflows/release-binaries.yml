name: Release binaries

# Builds the rdapcli console utility and attaches the binaries to the GitHub
# release on version tags: a Windows exe (x64) and a Linux ELF (x86_64,
# glibc). On workflow_dispatch the job only builds and uploads workflow
# artifacts, so the pipeline can be validated without touching a release.
#
# Plain FPC build (no Lazarus IDE in CI): the project tree compiles with unit
# paths only - src/rdapclient, the sibling fp-idn repository (punycode for
# IDNA) and the Synapse repository (SOCKS5 proxy transport), mirroring the
# local build recipe. HTTPS at runtime needs OpenSSL libraries in PATH (the
# same requirement as the library; the DLLs/so are not bundled here).
#
# The release itself (manifest commit, release notes) is created by
# opm-update.yml on the same tag push; the attach step below is idempotent
# (create-if-missing) so the two workflows can race safely.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdapcli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: rdapcli-linux-x86_64
          - os: windows-latest
            asset: rdapcli-windows-x64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Clone fp-idn and Synapse
        run: |
          git clone --depth 1 https://github.com/Al-Muhandis/fp-idn.git ../fp-idn
          git clone --depth 1 https://github.com/geby/synapse.git ../synapse

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fpc

      - name: Install FPC 3.2.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The dedicated fpc-3.2.2.win64.exe no longer exists on SourceForge:
          # the release folder was renamed to Win32/3.2.2/ and the file is now
          # the combined fpc-3.2.2.win32.and.win64.exe. Datacenter IPs (CI
          # runners) get an HTML interstitial page from the generic
          # downloads.sourceforge.net endpoint, so direct
          # <mirror>.dl.sourceforge.net URLs are tried first; every download
          # is validated (size + MZ header) before it is executed.
          $urls = @(
            'https://master.dl.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe',
            'https://phoenixnap.dl.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe',
            'https://altushost-swe.dl.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe',
            'https://cfhcable.dl.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe',
            'https://cytranet-dal.dl.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe',
            'https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe?viasf=1'
          )
          $ok = $false
          foreach ($url in $urls) {
            "Trying $url"
            try { Invoke-WebRequest -Uri $url -OutFile fpcsetup.exe -MaximumRedirection 10 -TimeoutSec 600 } catch { "Download failed: $_"; continue }
            $size = (Get-Item fpcsetup.exe).Length
            "Downloaded $size bytes"
            if ($size -lt 50MB) { continue }
            $fs = [System.IO.File]::OpenRead('fpcsetup.exe')
            $mz = [byte[]]::new(2)
            $fs.Read($mz, 0, 2) | Out-Null
            $fs.Close()
            if ($mz[0] -eq 0x4D -and $mz[1] -eq 0x5A) { $ok = $true; break }
          }
          if (-not $ok) { exit 1 }
          Start-Process -Wait -PassThru -FilePath .\fpcsetup.exe -ArgumentList '/SP-','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\FPC' | ForEach-Object { if ($_.ExitCode -ne 0) { exit $_.ExitCode } }
          if (-not (Test-Path 'C:\FPC\bin\x86_64-win64\fpc.exe')) { Get-ChildItem C:\FPC -Recurse | Select-Object -ExpandProperty FullName; exit 1 }
          # The silent installer normally writes fpc.cfg into the compiler bin
          # directory; regenerate it as a fallback in case that step is skipped.
          if (-not (Test-Path 'C:\FPC\bin\x86_64-win64\fpc.cfg')) {
            & C:\FPC\bin\x86_64-win64\fpcmkcfg.exe -d 'basepath=C:\FPC' -o C:\FPC\bin\x86_64-win64\fpc.cfg
          }
          "FPC_EXE=C:\FPC\bin\x86_64-win64\fpc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build rdapcli (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p units
          fpc -O3 -Xs -o"$GITHUB_WORKSPACE/${{ matrix.asset }}" -Fusrc -Fu../fp-idn -Fu../synapse -FUunits cli/rdapcli.lpr

      - name: Build rdapcli (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:FPC_EXE -O3 -Xs "-o$($env:GITHUB_WORKSPACE)\${{ matrix.asset }}" -Fusrc -Fu../fp-idn -Fu../synapse -FUunits cli/rdapcli.lpr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach to the GitHub release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "fp-rdap ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" --clobber

      - name: Upload as a workflow artifact (validation runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
